[project]
name = "neurico-harbor-agent"
version = "0.2.0"
description = "ACP adapter for running NeuriCo AutoResearch in Harbor task environments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "ChicagoHAI" }]
dependencies = [
    "agent-client-protocol>=0.12.1,<0.13",
    "neurico",
]

[project.scripts]
neurico-harbor-agent = "neurico_harbor_agent.__main__:main"
codex = "neurico_harbor_agent.codex_bootstrap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurico_harbor_agent"]

[tool.uv.sources]
neurico = { path = "../..", editable = true }

[project.optional-dependencies]
dev = ["pytest>=8.0"]
