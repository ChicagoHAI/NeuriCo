# NeuriCo Interactive Manager Configuration
#
# These settings control the behavior of the interactive mode manager.
# Override via environment variables (NEURICO_MANAGER_*) or .env file.

manager:
  # LLM backend for manager reasoning
  # Options: "cli" (uses claude -p, no extra keys), "anthropic_api", "openrouter"
  # Can also be set via NEURICO_MANAGER_BACKEND env var
  llm_backend: cli

  # Model to use for manager reasoning (null = default for backend)
  # For cli: uses whatever claude version is installed
  # For anthropic_api: e.g., "claude-sonnet-4-6"
  # For openrouter: e.g., "anthropic/claude-sonnet-4"
  # Can also be set via NEURICO_MANAGER_MODEL env var
  llm_model: null

  # Engagement level: how often the manager stops to ask the user
  # "hands_off": only critical decisions (direction changes, failures)
  # "balanced": stage transitions + significant choices (default)
  # "hands_on": frequent check-ins, present options at every step
  engagement: balanced

  # How often to check agent status during long runs (seconds)
  poll_interval: 60

  # How often to proactively show progress summaries during long runs (seconds)
  engagement_interval: 1800  # 30 minutes

  # HITL only: provider turns one unresolved worker request may spend across
  # reminder rounds. Unset/null = no cap (the default; completion comes first).
  # No code reads this key today; it is kept as the documented opt-in name.
  hitl_manager_max_request_provider_turns: null

  # HITL only: provider retry policy and MCP startup window. These now live in
  # config/agents.yaml under roles.hitl_manager (retry.max_attempts 3,
  # retry.backoff_s 1.0, mcp.startup_timeout_s 30, mcp.startup_increment_s 15).
  # The keys below still override them when set, for configurations written
  # before the move:
  # hitl_manager_backend_retries: 3
  # hitl_manager_retry_delay_seconds: 1.0
  # hitl_manager_mcp_startup_timeout_seconds: 30
  # hitl_manager_mcp_startup_timeout_increment_seconds: 15
  #
  # HITL and interactive: NEURICO_MANAGER_FACTORY=1 runs CLI manager turns
  # through the agent factory (roles hitl_manager / interactive_manager in
  # config/agents.yaml: Azure lane, per-turn ledger line). Default off this
  # release; see docs/AGENT_AUTH.md "Manager turns".

  # HITL only: ReAct turns (provider call + tool calls) per manager reply.
  # Unset/null = no cap, the loop ends when the provider stops calling tools.
  # Opt in with e.g. `hitl_manager_max_turns: 12`.
  hitl_manager_max_turns: null

  # Default AI provider for research agents
  default_provider: claude
