# Per-role agent defaults for core.agent_factory (docs/AGENT_FACTORY_ASSESSMENT.md 4.3).
#
# Precedence, highest first: CLI flag (factory.spec(role, **overrides)) >
# NEURICO_AGENT_PROVIDER / NEURICO_AGENT_MODEL / NEURICO_AGENT_AUTH > role block
# (following its `extends` chain) > `default` block. The same file is read at
# /app/config in the container and $PROJECT_ROOT/config on the host.
#
# Blocks the factory interprets: provider, model, auth, permissions, budget,
# output, extra_outputs, retry, transcript, reasoning_effort, system_prompt,
# mcp_config, use_scribe, skills, env_allowlist, isolate_home, extra_args,
# env_extra, tags, defer_provider_failure_to_runtime. Any other key (template,
# routes, params, model_env, kind, mcp, codex, backend) is kept on AgentSpec.extras for
# the readers that own it (prompt registry, LLMClient, manager).
#
# `validator` / `check` values are "module:function" references resolved only
# when a contract is evaluated; `schema` paths are relative to the project root.
version: 1

default:
  provider: claude                 # NEURICO_AGENT_PROVIDER / --provider
  model: null                      # NEURICO_AGENT_MODEL / --model (null = CLI default; Azure maps Codex to a deployment)
  auth: oauth                      # NEURICO_AGENT_AUTH / --agent-auth
  permissions: {mode: bypass}      # --full-permissions / --no-full-permissions -> bypass / inherit
  # Budgets are opt-in. By default nothing stops a run: no wall clock (timeout_s 0 = no limit),
  # no turn cap, no cost cap and no prompt-size cap. A caller's `timeout=None` means "use this
  # file"; `timeout=0` means "no limit". To opt in, set the value here (per role or in `default`)
  # or pass the CLI flag / JobSpec field: e.g. `budget: {timeout_s: 1800}`,
  # `budget: {max_cost_usd: 40, hard: true}` (hard: raise BudgetExceeded instead of only
  # recording the overrun). `max_prompt_chars` is only for a provider's real context limit
  # (Claude: ~800k chars for a 200k-token window); the check fails the launch before any spend.
  budget: {timeout_s: 0, max_turns: null, max_cost_usd: null, max_prompt_chars: null, hard: false}
  retry: {max_attempts: 1, max_invalid_outputs: 0, backoff_s: 30, rate_limit_backoff_s: 90, retry_on_timeout: false}
  transcript: {save_prompt: true, attempt_numbered: false}
  output: {kind: return_code}

roles:
  argon_env_builder:
    # One Codex agent per Gemini-Argon evaluation, building a rerunnable environment under
    # safety-gemini-argon-envs/envs/<id>/ (tools/codex_env_loop.py in that folder drives it).
    # Codex on Azure (GPT-6-Astra) with full permissions; the loop owns restarts, so one attempt here.
    provider: codex
    model: gpt-6-astra
    auth: azure
    permissions: {mode: bypass}
    output: {kind: files, required_files: [BUILD_REPORT.md]}
    retry: {max_attempts: 1}
    transcript: {stem: build, save_prompt: true}
    tags: {project: gemini-argon-envs}
  resource_finder:
    # tolerate_nonzero: today's verdict is "the marker exists", whatever the exit code
    output: {kind: marker, marker: .resource_finder_complete, tolerate_nonzero: true}
    template: agents/resource_finder.txt
  rule_maker:
    transcript: {attempt_numbered: true}
    output: {kind: validator, validator: agents.rule_maker:validate_rule_maker_outputs}
    retry: {max_invalid_outputs: 0}   # the orchestrator's verifier loop owns the retry
    template: agents/rule_maker.txt
  rule_maker_bootstrap:
    output: {kind: validator, validator: agents.rule_maker_bootstrap:bootstrap_output_contract}
    template: agents/rule_maker_bootstrap.txt
  manifest_trimmer:
    transcript: {stream_json: false}  # plain-text mode: stdout is the JSON answer
    output: {kind: json_stdout, schema: config/schemas/manifest_trim.json}
    retry: {max_invalid_outputs: 0}   # core.workspace_manifest.curate_manifest owns the retry (prior_error)
    template: agents/manifest_trimmer.txt
  experiment_runner:
    output: {kind: files, required_files: [REPORT.md]}
    transcript: {prefix: execution}
    template: agents/session_instructions.txt
  autoresearch_proposer:
    # The site (agents/autoresearch_proposer.py) reads budget.max_prompt_chars from here before
    # the launch; null = no prompt-size check. The old constant was 900000.
    output: {kind: files, required_files: [proposal.md]}
    transcript: {prefix: proposer}
    template: agents/autoresearch_proposer.txt
  comment_handler:
    output: {kind: return_code, tolerate_nonzero: true}   # today's behaviour, made explicit
    template: agents/comment_handler.txt
  paper_writer:
    output: {kind: return_code}     # today's verdict is the launch; the pipeline looks for the PDF itself
    template: agents/paper_writer.txt
  zero_shot:                        # baseline/zero_shot.py
    output: {kind: return_code}     # today's verdict is the launch; paper_exists is reported separately
    transcript: {prefix: zeroshot}
  # -- manager turns (interactive/llm_backend.LLMBackend over AgentFactory.session()) ----------------
  # Used when NEURICO_MANAGER_FACTORY=1 (default off this release; docs/AGENT_AUTH.md "Manager
  # turns"). The permission mode is chosen per turn by the backend: `mcp_only` for a bridged HITL
  # turn (claude --tools ToolSearch --allowedTools ... --mcp-config ... --strict-mcp-config), `no_tools`
  # for a tool-less one (claude --safe-mode --tools ""); Codex gets a read-only sandbox either way.
  hitl_manager:
    permissions: {mode: mcp_only}
    # retry: provider attempts per manager turn and the delay between them. Consumed by
    # core.hitl_manager_react.HitlManager._send on both paths (config/manager.yaml
    # hitl_manager_backend_retries / hitl_manager_retry_delay_seconds override when set);
    # the factory itself runs each turn once.
    retry: {max_attempts: 3, backoff_s: 1.0}
    # mcp: the CLI's own MCP startup window per turn, grown by the increment on each readiness
    # retry (manager.yaml hitl_manager_mcp_startup_timeout_seconds / _increment_seconds override).
    # It bounds server startup, never the manager's work.
    mcp: {startup_timeout_s: 30, startup_increment_s: 15}
    codex: {sandbox: read-only, skip_git_repo_check: true}
    transcript: {echo: false, separate_stderr: true}   # the stream is parsed, not shown; stderr kept out of it
    hitl_budget_context: false      # the manager adds the run's budget context as a system message itself
    session: {resume: false}        # every turn carries the whole transcript; `true` adds --resume / codex resume
    # Opt in to one provider turn per launch with `budget: {max_turns: 1}`; the default is unlimited.
  interactive_manager:              # ./neurico interactive (interactive/manager.py), the same backend
    backend: cli                    # cli | anthropic_api | openrouter (today's manager.llm_backend)
    permissions: {mode: inherit}    # today's plain `claude -p` (no permission flag); tools are described in the prompt
    codex: {sandbox: read-only, approval_policy: never, skip_git_repo_check: true}
    transcript: {echo: false, separate_stderr: true}
    session: {resume: false}
  safety_planner:
    # validate_proposals needs the kb, campaign and mode, so safety.planner runs it after the launch
    output: {kind: return_code}
    templates: {replicate: agents/safety_planner.txt, ideate: agents/safety_ideator.txt}
  planner: {extends: safety_planner}
  ideator:                          # base of the ideation.* roles below (the single-session ideate mode is retired)
    extends: safety_planner
    model: null
  model_scout:
    provider: codex
    template: agents/model_scout.txt
  # -- direct API roles (core.llm_client.LLMClient, step 5), not CLI sessions -------------------
  # `routes` is the fallback order; a route is used when its key is set (openrouter:
  # OPENROUTER_KEY / OPENROUTER_API_KEY, openai: OPENAI_API_KEY, anthropic: ANTHROPIC_API_KEY,
  # azure_openai / azure_foundry: NEURICO_AZURE=1 + the core.azure_config variables). A rejected
  # key, no credits or a key limit marks the route down for 600 s; a 429 moves on at once.
  # `params.timeout_s` is the outer wall clock for one call (all routes together); null or 0 =
  # no deadline, which is the default: an API call is never cut short on elapsed time unless a
  # role opts in here (e.g. `params: {timeout_s: 180}`) or the caller passes timeout_s.
  # `privacy` is sent with every request: OpenRouter's `provider` object (zero data retention,
  # no data collection), direct OpenAI's `store: false`. `model_env` names the per-role model
  # override; `model: null` on azure_openai means the configured deployment
  # (NEURICO_AZURE_CODEX_MODEL, else AZURE_OPENAI_DEPLOYMENTS[0]).
  judge:
    kind: api
    routes:
      - {name: openrouter, model: openai/gpt-4.1, privacy: {zdr: true, data_collection: deny}}
      - {name: openai,     model: gpt-4.1,        privacy: {store: false}}
    params: {temperature: 0, max_tokens: 4096, timeout_s: null, response_format: json_object}
  eval_verifier:                    # agents/eval_verifier.py; messages from agents/eval_verifier.txt
    extends: judge
    model_env: NEURICO_EVAL_VERIFIER_MODEL
  idea_converter:                   # cli/submit_local.py and cli/fetch_from_ideahub.py (YAML out, template fallback)
    extends: judge
    model_env: NEURICO_IDEA_CONVERTER_MODEL
    params: {temperature: 0.1, max_tokens: 2000, timeout_s: null, response_format: null}
  interactive_manager_api:          # interactive/llm_backend.py anthropic_api / openrouter backends
    kind: api                       # the backend name picks the route; both share these defaults
    model_env: NEURICO_MANAGER_MODEL
    routes:
      - {name: anthropic,  model: claude-sonnet-4-6}
      - {name: openrouter, model: anthropic/claude-sonnet-4}
    params: {max_tokens: 4096, timeout_s: null}
  # repo_namer: none. core/github_manager.py names repositories mechanically from the idea
  # text (no API call), so the role the assessment lists has no call site.
  #
  # services/paper-finder keeps its own LangChain stack (assessment 4.4 site 30). Its
  # environment is the `judge` routes above: OPENROUTER_KEY / OPENROUTER_API_KEY then
  # OPENAI_API_KEY, model openai/gpt-4.1 (its conf/config.toml spells it
  # `openai:gpt-4.1-2025-04-14` and rewrites it per provider). docker/host.sh and
  # docker/run.sh pass those variables through; nothing is generated from this file yet.

  ideation.problem:                 # the three stages ported in IDEATION_INTEGRATION.md 4.2
    extends: ideator
    provider: codex
    permissions: {mode: bypass}
    # Opt in to the digest's old caps with `budget: {timeout_s: 1500, max_cost_usd: 40, hard: true}`
    # (SAI_DIGEST_STAGE_TIMEOUT_S / SAI_DIGEST_MAX_COST_USD); the default is no limit.
    retry: {max_attempts: 3, max_invalid_outputs: 1, retry_on_timeout: false}
    isolate_home: true
    skills: [templates/skills/safety-kb]
    output: {kind: json_file, path: output/problem.json, schema: src/ideation/schemas/problem.schema.json,
             check: ideation.runtime:_check_problem}
  ideation.ideation:
    extends: ideation.problem
    output: {kind: json_file, path: output/ideas.json, schema: src/ideation/schemas/ideas.schema.json,
             check: ideation.runtime:_check_ideas}
  ideation.idea_judge:
    extends: ideation.problem
    output: {kind: json_file, path: output/ideas_ranked.json, schema: src/ideation/schemas/ideas_ranked.schema.json,
             check: ideation.runtime:_check_ranked}

  # -- model-monitor (mechanistic interpretability + monitoring) --------------------------------
  # agents/model_monitor.py launches a CLI agent that runs the mech-interp toolkit: hooked local
  # serving for activation access, probes on internals, SAEs (Gemma Scope / Gemma Scope 2 / Llama
  # Scope), and causal interventions. Full permissions because it drives uv, srun/sbatch (dsi-slurm)
  # and GPU jobs; success is the files contract (REPORT.md). The skills below are copied into the
  # agent workspace so it composes them rather than re-implementing serving/evals/cluster logic.
  model_monitor:
    provider: claude
    permissions: {mode: bypass}
    output: {kind: files, required_files: [REPORT.md]}
    retry: {max_attempts: 1}          # GPU runs are expensive; the agent polls its own jobs in-turn
    transcript: {prefix: model_monitor, save_prompt: true}
    skills: [templates/skills/mech-interp, templates/skills/safety-evals, templates/skills/dsi-slurm]
    template: agents/model_monitor.txt
    tags: {project: model-monitor, lane: interp}
  model_monitor.probe:                # Phase-1: linear/nonlinear probes on hidden states
    extends: model_monitor
  model_monitor.sae:                  # SAE feature analysis / training
    extends: model_monitor
  model_monitor.causal:               # activation/path patching, tracing, steering
    extends: model_monitor

ledger:
  path: .neurico/agent_runs.jsonl   # relative to work_dir (next to RunTracker's .neurico/runs/); the safety
                                    # daemon, planner and ideation pass the KB root as work_dir
  global_path: logs/agent_runs.jsonl   # relative to the project root; NEURICO_AGENT_LEDGER overrides
  redact: [argv_env]                # never write env values
