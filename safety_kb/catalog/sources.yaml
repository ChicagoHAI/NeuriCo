# Where the crawler looks (src/safety/crawler.py, `./neurico safety crawl`). This is data, not code:
# categories, keyword lists and feed URLs live here so the sweep can be tuned without a Python change.
# Every item found becomes one dated note under inbox/ with front matter (source, url, published,
# fetched, hash); items already seen (hash registry: inbox/seen.jsonl + the `seen` table in kb.sqlite)
# are skipped. No LLM calls: triage is the planner's job. Social-media sources are deliberately absent
# (no credentials, no scraping of X/LinkedIn); forums with public feeds are fine.
#
# Politeness: one request every `rate_limit_seconds` per host, a descriptive User-Agent, and every
# source wrapped so a feed that is down is reported, not fatal. Mark a feed `enabled: false` to park it.

user_agent: "neurico-safety-crawler/0.1 (+https://github.com/ChicagoHAI/neurico; AI-safety evaluation research)"
rate_limit_seconds: 3.0          # arXiv asks for >= 3 s between API calls; applied per host everywhere
timeout_seconds: 30
retry_wait_seconds: 15           # one retry after this on HTTP 429 / 5xx / timeouts, then the source is reported down
max_items_per_source: 40         # cap per source per run, newest first
lookback_days: 7                 # ignore items published earlier than this (per-source override: lookback_days)

arxiv:
  api: http://export.arxiv.org/api/query
  max_results: 100               # per query; the API pages, we take one page sorted by submittedDate
  lookback_days: 7
  categories: [cs.CL, cs.AI, cs.LG, cs.CR, cs.CY]
  # Each entry is one query: (categories) AND (any keyword) [AND (any require term)]. A paper is kept
  # only when a keyword (and a require term, when given) appears in its title or abstract; use
  # `require` for keyword lists that are generic on their own ("linear probe" matches time-series
  # papers). Keep lists short: arXiv ANDs/ORs phrase terms literally and long queries return 400.
  queries:
    - id: safety-evals
      keywords: ["safety evaluation", "red teaming", "jailbreak", "harmful compliance", "over-refusal", "refusal"]
      require: ["language model", "LLM", "chatbot", "assistant"]
    - id: honesty-deception
      keywords: ["sycophancy", "sandbagging", "scheming", "alignment faking", "evaluation awareness", "deceptive alignment"]
    - id: monitoring-control
      keywords: ["chain-of-thought monitoring", "AI control", "scalable oversight", "sabotage evaluation", "model organisms", "unfaithful reasoning"]
    - id: agents-misuse
      keywords: ["prompt injection", "agent safety", "tool misuse", "cyber capability", "biosecurity uplift", "dual-use"]
      require: ["language model", "LLM", "agent"]
    - id: interpretability-probes
      keywords: ["linear probe", "activation steering", "sparse autoencoder", "representation engineering"]
      require: ["safety", "deception", "harmful", "refusal", "jailbreak", "alignment"]

huggingface:
  api: https://huggingface.co/api
  lookback_days: 14
  models_per_author: 20          # newest repos per `hf_authors` entry of catalog/families.yaml
  include_datasets: true
  dataset_searches: [jailbreak, "red team", "safety eval", sycophancy, "harmful behaviors", "prompt injection", "model organism"]
  datasets_per_search: 15
  skip_tags: [gguf, awq, gptq, mlx]   # quantised re-uploads are not new subjects

