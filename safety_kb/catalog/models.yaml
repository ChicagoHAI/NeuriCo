  - id: claude-opus-5-5
    family: claude
    vendor: Anthropic
    access: anthropic:claude-opus-5-5
    api: true
  - id: claude-fable-5-1
    family: claude
    vendor: Anthropic
    access: anthropic:claude-fable-5-1
