  - {id: qwen3-32b, family: qwen, vendor: Alibaba, access: "vllm:Qwen/Qwen3-32B", params_b: 32, gpu_memory_gb: 75, gpu_memory_utilization: 0.9, max_model_len: 8192, license: Apache-2.0}
