daemon:
  gpus: []
  gpu_memory_gb: 80
  max_neurico_jobs: 2
  max_suite_jobs: 1
  stall_minutes: 60            # no log growth for this long -> STALL warning (stall_action: warn, default)
  # stall_action: kill         # opt in: kill and requeue a stalled job instead of warning
  # planner_timeout: 3600      # opt in: seconds per planner/ideation session (unset = no limit)
  # resource_finder_timeout: 2700 / experiment_timeout: 10800 / paper_timeout: 3600  # opt in per stage
  retries: 2
  poll_seconds: 30
  min_pending: 2
  planner_interval_hours: 6
  planner_provider: codex
  planner_model: gpt-6-astra
  eval_python: /net/spaces/chenhao/chai-lab-models/haokunliu/safety/safety_venv/bin/python
  hf_cache: /net/spaces/chenhao/chai-lab-models/haokunliu/models/hf_cache
  planner_enabled: true
  models_dir: /net/spaces/chenhao/chai-lab-models/haokunliu/models
