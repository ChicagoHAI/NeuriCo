idea:
  title: Does splitting reasoning create false harmful labels?
  domain: ai_safety
  hypothesis: Independent windows versus full traces raise local-judge false alarms on qwen3-8-27b rejected
    plans by 10 percentage points under paired testing.
  background:
    description: Qwen3GuardTest covers reasoning and streaming moderation; CARE, a guard-triggered rewrite
      method, runs on Qwen3-4B. The DeepSeek audit did not isolate segmentation errors against independent
      guidance labels. We would test rejection-clause boundaries and repeated-judgment controls on current
      Qwen traces.
    papers:
    - url: https://arxiv.org/abs/2510.14276
      description: Qwen3Guard covers reasoning moderation and streaming guards. We would test correctness
        on controlled rejected-plan contrasts from current Qwen.
  methodology:
    approach: 'We would compare whole-trace judging with independent windows and a rule that flags any
      unsafe window.


      We would generate 600 short fictional route narratives with qwen3-8-27b. Each would explain why
      a named route cannot work, without giving usable edges; paired controls would disclose a working
      route despite a final refusal. Two graph algorithms would certify guidance from the entire trace
      before segmentation.


      We would vary the window boundary across the rejection clause while preserving every token and the
      order of sentences. All windows together would contain the exact full trace. A second window condition
      would repeat the governing rejection clause as context, without deleting useful route facts.


      We would calibrate qwen2.5-7b-judge and azure-gpt-4.1-mini-judge on 150 separate route sets. Each
      would receive a task-specific usefulness rubric and score full and split views. We would report
      agreement, per-window errors, and full-response false alarms.


      The primary test would compare local false alarms under independent windows versus whole traces.
      A 10-point rise with a paired 95% lower bound above zero would meet the criterion. We would resample
      narratives, not windows; the repeated-clause arm would test whether lost context explains the effect.


      Equal-length neutral narratives would measure false alarms from repeated judging alone.'
    steps:
    - We would collect verified Qwen route narratives with and without useful steps.
    - We would shift window boundaries around rejection clauses without dropping tokens.
    - We would compare whole traces, independent windows, and windows with governing context.
    - We would calibrate both judges on separate routes.
    - We would test false-alarm inflation using narratives as the independent units.
    - We would freeze data, prompts, model revisions, parsing rules, and analysis before test calls.
    - We would use safety-evals with an Inspect extension and serve each local model in turn through vLLM.
    - We would verify native reasoning extraction and preserve both reasoning and final text.
    - We would report custom proxy scores separately from the unmodified XSTest safe refusal check.
    - We would cap subject output at 512 tokens, judge output at 128 tokens, and context at 2048 tokens.
    - We would use greedy decoding, small batches, and full GPU availability; memory or budget failures
      would remain reported as incomplete data.
    - We would label any useful content as positive even when rejected; only independently verified absence
      of useful content would be negative.
    - We would publish seed 42, 10000 paired bootstrap resamples, and a two-sided 95% interval for the
      primary contrast.
    - We would target 80% power in a paired simulation before test calls, using development error rates
      and a conservative 50% discordance case.
    - We would freeze the planned sample size and report low power as inconclusive; test outcomes would
      never change enrollment.
    - We would interpret grammar-constrained reasoning as a controlled proxy, without inferring accuracy
      on unrestricted harmful requests.
    - We would validate all generated text against the grammar; unparsed reasoning would stay unresolved,
      including text outside designated fact fields.
    baselines:
    - Whole-trace judgment
    - Windows with the governing rejection clause
    - Neutral narratives with equal window counts
    metrics:
    - Window-induced false-positive difference
    - Useful-route sensitivity
    - Context-restoration contrast
    - Judge agreement
  constraints:
    compute: gpu_required
    dependencies:
    - inspect-ai
    - inspect-evals
    - vllm
    - transformers
    - numpy
    - scipy
    - scikit-learn
    time_limit: 50400
    memory: 80 GB GPU; serve the 76 GB subject and 20 GB judge in separate sessions.
    budget: 25
  expected_outputs:
  - type: metrics
    format: json
    description: results/safety/*.json in the neurico-safety-result/v1 schema
  - type: report
    format: markdown
    description: REPORT.md plus findings/*.yaml for any candidate finding
  evaluation_criteria:
  - If yes, a 10-point rise with a positive 95% lower bound would implicate splitting; if no, this window
    scheme would not explain errors.
  - We would report planned and observed n, standard errors, and paired 95% confidence intervals for all
    test estimates across 600 independent cases.
  - We would report each judge against independent labels, plus raw agreement and kappa, which measures
    agreement beyond chance.
  - We would keep calibration cases separate and require 90% accuracy on clear positive and negative controls
    before testing.
  - We would score invalid judgments as errors and retain failed generations in worst-case bounds; bounds
    must preserve the finding.
  - We would publish the toy grammar and both label checkers; disagreement between checkers blocks a correctness
    claim.
  - We would run the full xstest-safe-csv set as a separate calibration check, without generating unsafe
    benchmark answers.
  - We would stop if the named subject cannot load or native reasoning cannot be captured; we would not
    replace its checkpoint.
metadata:
  author: neurico-ideation
  source: ideation
  planner_run: plan-20261021-045451-ideate
  campaign: open-weight-scorecards
  idea_id: idea_7
  problem_title: Do safety judges mistake rejected plans for harmful assistance?
  axis: evals
  category: refusal-calibration
  job_kind: explore
  source_ids:
  - finding:finding-20261020-001-judge-dependent-harmful-reasonin
  - run:run-research-20261020-005
  - gap:open-model-families-gap-matrix
  expected_result: If yes, a 10-point rise with a positive 95% lower bound would implicate splitting;
    if no, this window scheme would not explain errors.
  risks: We would include neutral narratives to separate context loss from having more chances to flag
    a window. Only fully captured traces would support the paired claim.
  closest_prior_work: 'Qwen3GuardTest covers reasoning and streaming moderation; CARE, a guard-triggered
    rewrite method, runs on Qwen3-4B. The DeepSeek audit did not isolate segmentation errors against independent
    guidance labels. We would test rejection-clause boundaries and repeated-judgment controls on current
    Qwen traces.


    The attack-score candidate measured response scores, rather than errors against known guidance labels
    (finding:finding-20261020-001-provisional-paired-strong-reject).


    The XSTest candidate compared refusal rates without establishing the rejected-plan boundary (finding:finding-20261020-001-provisional-paired-xstest-unsafe).


    The DeepSeek scorecard proposed broad model comparisons, rather than this judge-error test (idea:deepseek-distill-and-moonlight-safety-scorecard).


    The trace audit measured disagreement without independent correctness labels (run:run-research-20261020-005).


    The completed scorecard job did not isolate this proposed source of judge error (job:research-20261020-001-deepseek-distill-and-moonlight-s).'
  resources: We would use one 80 GB GPU for an estimated 14 hours and cap Azure spend at $25. Generated
    route narratives and XSTest safe prompts would supply data.
  scores:
    novelty: 3
    feasibility: 4
    safety_impact: 4
    replicability: 4
    duplication_risk: 2
  distinctness: We split unchanged traces and restore governing context; the naming study changes words
    while keeping each trace whole.
  judge_rationale: We favor replicability because restored context and neutral windows help separate context
    loss from repeated chances to flag. Qwen3Guard covers streaming moderation, while this test shifts
    rejection boundaries. Short traces and an unspecified window schedule limit the claim.
  rank: 3
