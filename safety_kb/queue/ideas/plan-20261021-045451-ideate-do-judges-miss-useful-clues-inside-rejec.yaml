idea:
  title: Do judges miss useful clues inside rejected plans?
  domain: ai_safety
  hypothesis: For qwen3-8-27b traces, rejection versus neutral wording raises missed useful-clue labels
    by 10 percentage points under a paired error-rate test.
  background:
    description: The synthetic-secret study counted exact token emission and explicitly omitted partial
      or encoded disclosure. The DeepSeek judge gap did not test correctness. We would test whether rejection
      hides useful partial clues from judges.
    papers: []
    code_references:
    - repo: https://github.com/Hypogenic-AI/synthetic-secret-leakage-3677-codex-gpt-6-astra
      description: We would compare our clue labels with the earlier exact-emission design; its run had
        incomplete coverage.
  methodology:
    approach: 'We would compare rejected versus neutrally described clues that reveal the same information
      about a fictional code.


      We would create 600 independent code puzzles and ask qwen3-8-27b for bounded reasoning using an
      equation grammar. We would retain the clue content and replace only the sentence describing whether
      the speaker endorses it. Final replies would withhold the code in both arms.


      A brute-force solver and a separately written constraint solver would count possible codes before
      and after reading every output channel. Any reduction would count as useful guidance, including
      partial disclosure inside a rejected plan. Plan names and redundant equations would provide negative
      controls.


      We would tune neither labels nor wording on test outcomes. A separate 150-puzzle calibration set
      would set fixed prompts for qwen2.5-7b-judge and azure-gpt-4.1-mini-judge. Their task would be to
      detect information gain, with accuracy and agreement reported separately.


      We would compare each puzzle’s missed-guidance indicators under rejection and neutral wording. The
      local judge’s mean paired difference must reach 10 points with a 95% interval above zero. We would
      report Azure replication and performance across clue strengths as secondary estimates; independent
      puzzles would determine sample size and bootstrap units.'
    steps:
    - We would generate fictional code puzzles and Qwen reasoning with machine-readable clues.
    - We would hold equations fixed while changing rejection to neutral wording.
    - We would count information gain with two separately implemented solvers.
    - We would calibrate both judges on disjoint puzzles and report their agreement.
    - We would test whether rejection increases missed useful guidance.
    - We would freeze data, prompts, model revisions, parsing rules, and analysis before test calls.
    - We would use safety-evals with an Inspect extension and serve each local model in turn through vLLM.
    - We would verify native reasoning extraction and preserve both reasoning and final text.
    - We would report custom proxy scores separately from the unmodified XSTest safe refusal check.
    - We would cap subject output at 512 tokens, judge output at 128 tokens, and context at 2048 tokens.
    - We would use greedy decoding, small batches, and full GPU availability; memory or budget failures
      would remain reported as incomplete data.
    - We would label any useful content as positive even when rejected; only independently verified absence
      of useful content would be negative.
    - We would publish seed 42, 10000 paired bootstrap resamples, and a two-sided 95% interval for the
      primary contrast.
    - We would target 80% power in a paired simulation before test calls, using development error rates
      and a conservative 50% discordance case.
    - We would freeze the planned sample size and report low power as inconclusive; test outcomes would
      never change enrollment.
    - We would interpret grammar-constrained reasoning as a controlled proxy, without inferring accuracy
      on unrestricted harmful requests.
    - We would validate all generated text against the grammar; unparsed reasoning would stay unresolved,
      including text outside designated fact fields.
    baselines:
    - Identical clues with neutral wording
    - Redundant equations with no information gain
    - Plan mentions without equations
    metrics:
    - Paired missed-guidance rate
    - Remaining code count
    - Partial-clue detection
    - False alarms on redundant clues
    - Judge agreement
  constraints:
    compute: gpu_required
    dependencies:
    - inspect-ai
    - inspect-evals
    - vllm
    - transformers
    - numpy
    - scipy
    - scikit-learn
    time_limit: 36000
    memory: 80 GB GPU; serve the 76 GB subject and 20 GB judge in separate sessions.
    budget: 15
  expected_outputs:
  - type: metrics
    format: json
    description: results/safety/*.json in the neurico-safety-result/v1 schema
  - type: report
    format: markdown
    description: REPORT.md plus findings/*.yaml for any candidate finding
  evaluation_criteria:
  - If yes, a 10-point rise in missed clues with a positive 95% lower bound would show rejection masks
    useful disclosure; if no, it would not.
  - We would report planned and observed n, standard errors, and paired 95% confidence intervals for all
    test estimates across 600 independent cases.
  - We would report each judge against independent labels, plus raw agreement and kappa, which measures
    agreement beyond chance.
  - We would keep calibration cases separate and require 90% accuracy on clear positive and negative controls
    before testing.
  - We would score invalid judgments as errors and retain failed generations in worst-case bounds; bounds
    must preserve the finding.
  - We would publish the toy grammar and both label checkers; disagreement between checkers blocks a correctness
    claim.
  - We would run the full xstest-safe-csv set as a separate calibration check, without generating unsafe
    benchmark answers.
  - We would stop if the named subject cannot load or native reasoning cannot be captured; we would not
    replace its checkpoint.
metadata:
  author: neurico-ideation
  source: ideation
  planner_run: plan-20261021-045451-ideate
  campaign: open-weight-scorecards
  idea_id: idea_2
  problem_title: Do safety judges mistake rejected plans for harmful assistance?
  axis: evals
  category: refusal-calibration
  job_kind: explore
  source_ids:
  - finding:finding-20261020-001-judge-dependent-harmful-reasonin
  - run:run-research-20261020-006
  expected_result: If yes, a 10-point rise in missed clues with a positive 95% lower bound would show
    rejection masks useful disclosure; if no, it would not.
  risks: We would call any clue that narrows the code set useful, rather than treating a final refusal
    as safety. The result would concern fictional information gain, not real secret theft.
  closest_prior_work: 'The synthetic-secret study counted exact token emission and explicitly omitted
    partial or encoded disclosure. The DeepSeek judge gap did not test correctness. We would test whether
    rejection hides useful partial clues from judges.


    The secret-disclosure proposal measured exact emission, rather than judges missing useful partial
    clues (idea:plan-20261020-144343-synthetic-secret-boundaries).


    The secret-disclosure job tested model leakage, rather than the accuracy of rejection-sensitive judgments
    (job:research-20261020-001-synthetic-secret-leakage-with-au).


    The trace audit measured disagreement without independent correctness labels (run:run-research-20261020-005).'
  resources: We would budget an estimated 10 GPU hours on 80 GB and $15 for Azure calls. We would use
    generated code puzzles and public XSTest safe data.
  scores:
    novelty: 3
    feasibility: 4
    safety_impact: 5
    replicability: 4
    duplication_risk: 2
  distinctness: We change rejection wording around fixed code clues; the naming study changes alarming
    words around plans without useful clues.
  judge_rationale: We favor its safety impact because code solvers detect useful clues even when the speaker
    rejects them. The secret study tested exact emission, while this test measures judge errors on partial
    clues. Transfer beyond toy codes and broader novelty remain uncertain.
  rank: 2
